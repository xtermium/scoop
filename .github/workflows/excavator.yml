# Checks every hour for a new xtermium release or nightly build and commits the manifest bump
# (checkver/autoupdate). Hourly: the nightly's files change under the same URL, so its hash is
# stale until this runs.
name: Excavator

on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: write

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
